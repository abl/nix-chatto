name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Bot-created PRs (GITHUB_TOKEN) do not trigger pull_request. The update
  # workflow dispatches this on the PR branch instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Build Chatto
        run: |
          nix build -L ".#packages.${{ matrix.system }}.chatto" --out-link result
          result/bin/chatto version
